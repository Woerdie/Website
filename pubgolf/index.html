<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pubgolf Scorekaart</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="./pubgolf.css?v=24">
</head>
<body>

    <div id="toast-container"></div>

    <div id="create-game-section" class="container-box">
        <h2>Nieuw Pubgolf Spel</h2>
        <div class="form-group">
            <input type="text" id="game-name" placeholder="Naam van het spel (bijv. Verjaardag Pubgolf)">
            <input type="number" id="game-holes" placeholder="Aantal holes (bijv. 9 of 18)" value="9">
            <input type="number" id="expected-players" placeholder="Verwacht aantal spelers" value="4">
            
            <label for="game-mode">Spelmodus</label>
            <select id="game-mode">
                <option value="solo">Iedereen apart</option>
                <option value="duos">Duo's</option>
                <option value="teams">Teams</option>
            </select>

            <div id="team-size-wrap" class="hidden">
                <label for="team-size">Aantal personen per team</label>
                <input type="number" id="team-size" value="4">
            </div>

            <label for="score-mode">Score-telling</label>
            <select id="score-mode">
                <option value="player">Score per speler bijhouden</option>
                <option value="team">1 Gezamenlijke score per team</option>
            </select>

            <button id="create-game-btn" class="primary-btn">Spel maken</button>
        </div>
    </div>

    <div id="saved-games-section" class="container-box">
        <h2>Je opgeslagen spellen</h2>
        <div id="saved-games-list"></div>
    </div>

    <div id="active-game-box" class="container-box hidden active-game-theme">
        <h2 id="active-game-name">-</h2>
        <p id="active-game-info"></p>
        
        <div id="runtime-score-mode-wrap">
            <label for="runtime-score-mode">Score-telling aanpassen:</label>
            <select id="runtime-score-mode">
                <option value="player">Tellen per individuele speler</option>
                <option value="team">Tellen per team (totaal)</option>
            </select>
        </div>

        <div class="action-row">
            <a id="share-link" href="#" class="btn outline-btn no-decor">Deellink kopiëren</a>
            <button id="delete-game-btn" class="danger-btn">Verwijder spel</button>
        </div>
    </div>

    <div id="players-section" class="container-box hidden">
        <h2>Spelers toevoegen</h2>
        <div class="input-inline">
            <input type="text" id="player-name" placeholder="Naam speler">
            <button id="add-player-btn" class="primary-btn">Toevoegen</button>
        </div>
        <p id="player-counter"></p>
        
        <div id="players-list"></div>

        <div id="team-choice-actions" class="hidden btn-flex-wrap">
            <button id="random-teams-btn" class="secondary-btn">Random teams maken</button>
            <button id="manual-teams-btn" class="outline-btn">Zelf teams kiezen</button>
        </div>

        <div id="manual-team-builder" class="hidden manual-builder-container"></div>
        <div id="teams-list"></div>

        <div class="section-footer">
            <button id="go-score-btn" class="primary-btn full-width">Naar score invoeren &rarr;</button>
        </div>
    </div>

    <div id="score-section" class="container-box hidden">
        <div class="score-header">
            <h2>Scores invullen</h2>
            <button id="edit-players-btn" class="outline-btn compact-btn">&larr; Spelers/Teams</button>
        </div>

        <div class="form-group-spaced">
            <label for="hole-select">Kies Hole:</label>
            <select id="hole-select"></select>
        </div>

        <div id="score-list"></div>

        <div class="btn-flex-wrap">
            <button id="save-scores-btn" class="primary-btn flex-grow">Hole scores opslaan</button>
            <button id="reset-scores-btn" class="light-btn">Scores resetten</button>
            <button id="end-game-btn" class="danger-btn flex-grow">Spel beëindigen</button>
        </div>
    </div>

    <div id="standings-section" class="container-box hidden">
        <h2>Tussenstand & Scorekaart</h2>
        <div id="leader-box"></div>
        
        <div class="table-responsive">
            <table id="scorecard-table"></table>
        </div>
        <div class="section-footer-left">
            <a id="score-share-link" href="#" class="btn outline-btn no-decor text-center inline-block">Deellink live stand</a>
        </div>
    </div>

    <div id="modal-backdrop" class="hidden backdrop-container">
        <div class="modal-card">
            <div id="modal-icon"></div>
            <h3 id="modal-title">-</h3>
            <p id="modal-message">-</p>
            <div id="modal-custom-content"></div>
            <input type="text" id="modal-input" class="hidden full-width-input">
            <div class="btn-flex-gap">
                <button id="modal-cancel-btn" class="outline-btn flex-grow">Annuleren</button>
                <button id="modal-confirm-btn" class="primary-btn flex-grow">Bevestigen</button>
            </div>
        </div>
    </div>

    <script src="./pubgolf.js?v=24"></script>
</body>
</html>
