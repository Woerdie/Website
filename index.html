<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Daan Woerdman</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f3ee;
    --card: #ffffff;
    --text: #1a1a18;
    --muted: #6e6c65;
    --line: #e2dfd6;
    --grid: rgba(26, 26, 24, 0.05);
    --accent: #f08a24;
    --accent-soft: rgba(240, 138, 36, 0.14);
    --cone-stripe: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121211;
      --card: #1b1b19;
      --text: #efede7;
      --muted: #9b9990;
      --line: #2b2a27;
      --grid: rgba(255, 255, 255, 0.04);
      --accent-soft: rgba(240, 138, 36, 0.18);
      --cone-stripe: #f3f1ea;
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Inter", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
    position: relative;
    overflow-x: hidden;
  }

  /* raster op de achtergrond, vervaagt naar de randen */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
    pointer-events: none;
    z-index: 0;
  }

  /* zachte oranje gloed */
  body::after {
    content: "";
    position: fixed;
    width: 520px;
    height: 520px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -60%);
    background: radial-gradient(circle, var(--accent-soft), transparent 65%);
    pointer-events: none;
    z-index: 0;
  }

  header, main, footer { position: relative; z-index: 1; }

  header {
    padding: 24px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px 64px;
  }

  .box {
    width: 100%;
    max-width: 520px;
    text-align: center;
    animation: rise 0.8s ease-out both;
  }

  .cone {
    width: 92px;
    height: auto;
    margin: 0 auto 28px;
    display: block;
    animation: wobble 4s ease-in-out infinite;
    transform-origin: 50% 100%;
  }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 7px 14px;
    margin-bottom: 24px;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 1.6s ease-in-out infinite;
  }

  h1 {
    font-size: clamp(38px, 9vw, 60px);
    line-height: 1.02;
    font-weight: 800;
    letter-spacing: -0.035em;
    margin-bottom: 18px;
  }

  h1 em {
    font-style: normal;
    color: var(--accent);
  }

  p {
    font-size: 17px;
    line-height: 1.6;
    color: var(--muted);
    max-width: 400px;
    margin: 0 auto 36px;
  }

  .progress {
    max-width: 280px;
    margin: 0 auto;
  }

  .bar {
    height: 6px;
    border-radius: 999px;
    background: var(--line);
    overflow: hidden;
  }

  .bar span {
    display: block;
    height: 100%;
    width: 40%;
    border-radius: 999px;
    background: repeating-linear-gradient(
      -45deg,
      var(--accent) 0 8px,
      #f6a85a 8px 16px
    );
    animation: load 2.4s ease-in-out infinite;
  }

  .progress small {
    display: block;
    margin-top: 10px;
    font-size: 12px;
    color: var(--muted);
  }

  footer {
    padding: 24px;
    text-align: center;
    font-size: 13px;
    color: var(--muted);
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes wobble {
    0%, 100% { transform: rotate(0deg); }
    25%      { transform: rotate(-3deg); }
    75%      { transform: rotate(3deg); }
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.4; transform: scale(0.8); }
  }
  @keyframes load {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(260%); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
  }
</style>
</head>
<body>
  <header>Daan Woerdman</header>

  <main>
    <div class="box">
      <svg class="cone" viewBox="0 0 100 110" aria-hidden="true">
        <ellipse cx="50" cy="104" rx="40" ry="5" fill="currentColor" opacity="0.08"/>
        <rect x="8" y="92" width="84" height="10" rx="3" fill="#f08a24"/>
        <path d="M42 8 h16 l24 84 h-64 z" fill="#f08a24"/>
        <path d="M37.5 32 h25 l4.5 16 h-34 z" fill="var(--cone-stripe)"/>
        <path d="M31 58 h38 l4.5 16 h-47 z" fill="var(--cone-stripe)"/>
        <path d="M42 8 h16 l3 10 h-22 z" fill="#d9731a"/>
      </svg>

      <div class="status"><span class="dot"></span>Werk in uitvoering</div>

      <h1>Even <em>geduld</em>,<br>hier wordt verbouwd.</h1>

      <p>Deze site krijgt een flinke opknapbeurt. Kom binnenkort nog eens terug, dan staat alles er weer netjes bij.</p>

      <div class="progress">
        <div class="bar"><span></span></div>
        <small>Bezig met bouwen</small>
      </div>
    </div>
  </main>

  <footer>&copy; <span id="year"></span> Daan Woerdman</footer>

  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
