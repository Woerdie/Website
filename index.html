<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Ultimate Paardenrace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A1F1C;
    --bg-alt:#123028;
    --panel:#0F2A23;
    --line:#1F4A3B;
    --line-soft:#183A2E;
    --gold:#C9A24B;
    --gold-bright:#EAC768;
    --cream:#F3ECD9;
    --cream-dim:#C9C2AD;
    --ink:#0E1A16;
    --hearts:#E24F68;
    --diamonds:#E39A3B;
    --clubs:#3FB897;
    --spades:#5C82E0;
    --danger:#E24F68;
    --radius:18px;
    --shadow: 0 20px 40px -20px rgba(0,0,0,0.6);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at top, #143a2f 0%, var(--bg) 55%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px);
    color:var(--cream);
    font-family:'Work Sans', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .display{ font-family:'Bebas Neue', sans-serif; letter-spacing:0.03em; }
  .mono{ font-family:'JetBrains Mono', monospace; }

  /* ---------- Ambient casino/drank background ---------- */
  .bg-decor{ position:fixed; inset:0; overflow:hidden; z-index:0; pointer-events:none; }
  .bg-decor::before{
    content:''; position:absolute; inset:0;
    background: radial-gradient(ellipse at 20% 10%, rgba(201,162,75,0.05), transparent 55%),
                radial-gradient(ellipse at 80% 85%, rgba(63,177,151,0.05), transparent 55%);
  }
  .bg-icon{ position:absolute; filter:blur(5px); opacity:0.09; line-height:1; user-select:none; }

  #app{ max-width:720px; margin:0 auto; padding:20px 18px 60px; min-height:100vh; position:relative; z-index:1; }

  /* ---------- Top bar ---------- */
  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; gap:10px; }
  .brand{ font-family:'Bebas Neue', sans-serif; font-size:19px; letter-spacing:0.06em; color:var(--gold); display:flex; align-items:center; gap:9px; min-width:0; }
  .brand-logo{ height:34px; width:auto; flex-shrink:0; filter:drop-shadow(0 2px 6px rgba(0,0,0,0.4)); }
  .brand span{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .topbar-actions{ display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .icon-link{ background:none; border:1px solid var(--line); color:var(--gold-bright); font-size:15px; width:34px; height:34px; border-radius:100px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all .15s; }
  .icon-link:hover{ border-color:var(--gold); background:rgba(201,162,75,0.1); }
  .reset-link{ background:none; border:1px solid var(--line); color:var(--cream-dim); font-family:'Work Sans'; font-size:12px; padding:7px 12px; border-radius:100px; cursor:pointer; transition:all .15s; white-space:nowrap;}
  .reset-link:hover{ border-color:var(--gold); color:var(--gold); }
  .reset-link.confirm{ border-color:var(--hearts); color:var(--hearts); font-weight:700; }

  /* ---------- Stepper (race track) ---------- */
  .track-wrap{ margin:6px 0 30px; }
  .track{ position:relative; height:6px; background:var(--line-soft); border-radius:6px; margin:0 10px; }
  .track-fill{ position:absolute; top:0; left:0; height:100%; background:linear-gradient(90deg,var(--gold),var(--gold-bright)); border-radius:6px; transition:width .5s cubic-bezier(.65,0,.35,1); }
  .track-horse{ position:absolute; top:50%; transform:translate(-50%,-50%); font-size:20px; transition:left .5s cubic-bezier(.65,0,.35,1); filter:drop-shadow(0 2px 4px rgba(0,0,0,.5)); }
  .track-posts{ display:flex; justify-content:space-between; margin-top:10px; padding:0 2px; }
  .post{ flex:1; text-align:center; font-size:10.5px; letter-spacing:0.04em; color:var(--cream-dim); text-transform:uppercase; font-weight:600; }
  .post.active{ color:var(--gold-bright); }
  .post-dot{ width:8px;height:8px;border-radius:50%; background:var(--line); margin:0 auto 6px; }
  .post.active .post-dot{ background:var(--gold); box-shadow:0 0 0 4px rgba(201,162,75,0.2);}
  .post.done .post-dot{ background:var(--gold); }

  /* ---------- Generic ---------- */
  h1,h2,h3{ margin:0; }
  .step-title{ font-family:'Bebas Neue'; font-size:30px; letter-spacing:0.04em; color:var(--cream); margin-bottom:4px;}
  .step-sub{ color:var(--cream-dim); font-size:14px; margin-bottom:22px; }
  .btn{
    font-family:'Work Sans'; font-weight:700; font-size:15px; border:none; border-radius:100px;
    padding:16px 24px; cursor:pointer; transition:transform .12s ease, box-shadow .12s ease, opacity .12s ease;
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn:active{ transform:scale(0.97); }
  .btn-primary{ background:linear-gradient(180deg,var(--gold-bright),var(--gold)); color:var(--ink); box-shadow:0 10px 24px -10px rgba(201,162,75,0.6); width:100%; }
  .btn-primary:hover{ box-shadow:0 14px 28px -10px rgba(201,162,75,0.8); }
  .btn-primary:disabled{ opacity:0.4; cursor:not-allowed; box-shadow:none; }
  .btn-ghost{ background:transparent; border:1.5px solid var(--line); color:var(--cream); width:100%; }
  .btn-ghost:hover{ border-color:var(--gold); color:var(--gold-bright); }
  .btn-text{ background:none; border:none; color:var(--cream-dim); font-size:13px; text-decoration:underline; cursor:pointer; padding:6px; }
  .btn-text:hover{ color:var(--gold-bright); }

  .card-panel{ background:var(--panel); border:1px solid var(--line-soft); border-radius:var(--radius); padding:18px; }

  /* ---------- Start screen ---------- */
  .start-wrap{ min-height:82vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  .start-logo{ width:100%; max-width:480px; margin-bottom:22px; filter:drop-shadow(0 14px 34px rgba(0,0,0,0.55)); animation:floaty 4s ease-in-out infinite; }
  .start-tagline{ max-width:340px; margin:2px 0 30px; }
  .tagline-main{ color:var(--cream); font-size:16.5px; font-weight:700; line-height:1.4; margin-bottom:8px; }
  .tagline-sub{ color:var(--cream-dim); font-size:14px; line-height:1.5; }
  .tagline-sub strong{ color:var(--gold-bright); }
  .start-cta{ max-width:320px; width:100%; display:flex; flex-direction:column; gap:10px; }
  .start-cta .btn-primary{ font-size:17px; padding:19px 24px; }
  .start-credit{ margin-top:20px; font-size:11.5px; color:var(--cream-dim); opacity:0.65; font-style:italic; letter-spacing:0.03em; }
  @keyframes floaty{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-6px);} }

  /* ---------- Players step ---------- */
  .add-player-row{ display:flex; gap:10px; margin-bottom:16px; }
  .add-player-row input{ flex:1; }
  input[type=text]{
    background:var(--bg-alt); border:1.5px solid var(--line); color:var(--cream); border-radius:12px;
    padding:14px 16px; font-family:'Work Sans'; font-size:15px; outline:none; transition:border-color .15s;
  }
  input[type=text]:focus{ border-color:var(--gold); }
  input[type=text]::placeholder{ color:#6d8378; }
  .icon-btn{ width:52px; height:52px; border-radius:12px; background:var(--gold); color:var(--ink); border:none; font-size:22px; cursor:pointer; flex-shrink:0; font-weight:700; }
  .icon-btn:hover{ background:var(--gold-bright); }
  .icon-btn:disabled{ opacity:.35; cursor:not-allowed; }

  .player-list{ display:flex; flex-direction:column; gap:8px; margin-bottom:24px; }
  .player-chip{
    display:flex; align-items:center; justify-content:space-between; background:var(--bg-alt);
    border:1px solid var(--line-soft); border-radius:12px; padding:12px 14px;
    animation:pop-in .25s ease;
  }
  @keyframes pop-in{ from{ opacity:0; transform:translateY(-6px) scale(0.98);} to{ opacity:1; transform:translateY(0) scale(1);} }
  .player-chip-name{ font-weight:600; display:flex; align-items:center; gap:10px; }
  .player-avatar{ width:28px; height:28px; border-radius:50%; background:linear-gradient(135deg,var(--gold),var(--gold-bright)); color:var(--ink); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; font-family:'Work Sans'; }
  .player-chip-actions{ display:flex; align-items:center; gap:2px; }
  .player-remove, .player-edit{ background:none; border:none; color:var(--cream-dim); font-size:16px; cursor:pointer; padding:4px 8px; line-height:1; }
  .player-remove{ font-size:18px; }
  .player-remove:hover{ color:var(--hearts); }
  .player-edit:hover{ color:var(--gold-bright); }
  .empty-hint{ color:var(--cream-dim); font-size:13.5px; padding:16px; text-align:center; border:1.5px dashed var(--line); border-radius:12px; margin-bottom:24px; }

  .known-chip-wrap{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:22px; }
  .known-chip{ display:flex; align-items:stretch; border:1.5px solid var(--line); border-radius:100px; overflow:hidden; background:var(--bg-alt); transition:border-color .15s; }
  .known-chip.selected{ border-color:var(--gold); }
  .known-chip-main{ background:none; border:none; color:var(--cream); padding:9px 6px 9px 14px; font-size:13.5px; font-weight:600; cursor:pointer; font-family:'Work Sans'; white-space:nowrap; }
  .known-chip.selected .known-chip-main{ background:linear-gradient(180deg,var(--gold-bright),var(--gold)); color:var(--ink); padding-right:8px; }
  .known-chip-del{ background:none; border:none; border-left:1px solid var(--line-soft); color:var(--cream-dim); padding:9px 12px; cursor:pointer; font-size:13px; }
  .known-chip-del:hover{ color:var(--hearts); }
  .known-chip.selected .known-chip-del{ border-left-color:rgba(0,0,0,0.15); }
  .known-chip.pending-delete{ border-color:var(--hearts); }
  .known-chip-del.confirm{ color:var(--hearts); font-weight:700; white-space:nowrap; padding:9px 12px; }
  .player-chip.editing{ display:flex; align-items:center; gap:8px; }
  .player-chip.editing input[type=text]{ flex:1; padding:9px 12px; font-size:14px; }
  .hint-inline{ text-transform:none; letter-spacing:0; color:var(--cream-dim); font-weight:400; font-size:11.5px; }

  .section-label{ font-size:12px; text-transform:uppercase; letter-spacing:0.08em; color:var(--gold-bright); font-weight:700; margin-bottom:10px; }
  .max-horses-row{ display:flex; gap:10px; margin-bottom:26px; }
  .max-pill{
    flex:1; background:var(--bg-alt); border:1.5px solid var(--line); color:var(--cream); border-radius:12px;
    padding:14px 0; text-align:center; font-family:'Bebas Neue'; font-size:20px; cursor:pointer; transition:all .15s;
  }
  .max-pill.active{ background:linear-gradient(180deg,var(--gold-bright),var(--gold)); color:var(--ink); border-color:transparent; }
  .warning-banner{ background:rgba(226,79,104,0.12); border:1px solid rgba(226,79,104,0.4); color:#ffb3c0; border-radius:12px; padding:12px 14px; font-size:13.5px; margin-bottom:16px; }

  /* ---------- Bets step ---------- */
  .player-bet-card{ background:var(--panel); border:1.5px solid var(--line-soft); border-radius:var(--radius); padding:16px; margin-bottom:14px; transition:border-color .2s; }
  .player-bet-card.over-limit{ border-color:var(--hearts); }
  .player-bet-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .player-bet-head .name{ font-weight:700; font-size:16px; display:flex; align-items:center; gap:10px; }
  .bet-count{ font-size:11.5px; font-family:'JetBrains Mono'; color:var(--cream-dim); background:var(--bg-alt); padding:5px 10px; border-radius:100px; border:1px solid var(--line-soft); }
  .suit-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .suit-row{ display:flex; flex-direction:column; gap:6px; background:var(--bg-alt); border-radius:12px; padding:10px; border:1px solid var(--line-soft); }
  .suit-row .suit-label{ display:flex; align-items:center; gap:6px; font-size:13px; font-weight:600; }
  .suit-row input{ padding:9px 10px; font-size:13px; border-radius:8px; }
  .suit-row input:disabled{ opacity:0.3; cursor:not-allowed; }
  .suit-symbol{ font-size:16px; }
  .suit-hearts{ color:var(--hearts); }
  .suit-diamonds{ color:var(--diamonds); }
  .suit-clubs{ color:var(--clubs); }
  .suit-spades{ color:var(--spades); }

  .overview-toggle{ width:100%; text-align:left; background:var(--bg-alt); border:1.5px dashed var(--line); color:var(--gold-bright); border-radius:12px; padding:12px 16px; font-size:13.5px; font-weight:600; cursor:pointer; margin:6px 0 18px; display:flex; align-items:center; justify-content:space-between; }
  .overview-panel{ margin-bottom:18px; }
  .overview-list{ display:flex; flex-direction:column; gap:10px; }
  .overview-player{ background:var(--bg-alt); border:1px solid var(--line-soft); border-radius:12px; padding:12px 14px; }
  .overview-player .name{ font-weight:700; font-size:14px; margin-bottom:6px; }
  .overview-bet-line{ display:flex; align-items:center; gap:8px; font-size:13.5px; color:var(--cream-dim); padding:2px 0; }
  .overview-bet-line b{ color:var(--cream); font-weight:600; margin-left:auto; font-family:'JetBrains Mono'; font-size:12.5px; }
  .overview-empty{ color:var(--cream-dim); font-size:13px; font-style:italic; }
  .overview-tabs{ display:flex; gap:8px; margin-bottom:14px; }
  .overview-tab{ flex:1; padding:9px 0; border-radius:100px; border:1.5px solid var(--line); background:var(--bg-alt); color:var(--cream-dim); font-size:12.5px; font-weight:700; cursor:pointer; font-family:'Work Sans'; transition:all .15s; }
  .overview-tab.active{ background:linear-gradient(180deg,var(--gold-bright),var(--gold)); color:var(--ink); border-color:transparent; }
  .overview-horse-list{ display:flex; flex-direction:column; gap:10px; }
  .overview-horse-row{ background:var(--bg-alt); border:1px solid var(--line-soft); border-radius:12px; padding:12px 14px; }
  .overview-horse-label{ font-weight:700; font-size:13.5px; display:flex; align-items:center; gap:7px; margin-bottom:6px; }
  .overview-horse-label .suit-symbol{ font-size:15px; }
  .overview-horse-names{ font-size:13.5px; color:var(--cream-dim); line-height:1.5; }
  .overview-empty-inline{ font-style:italic; }

  /* ---------- Scoreboard ---------- */
  .score-list{ display:flex; flex-direction:column; gap:10px; }
  .score-row{ display:flex; align-items:center; gap:12px; background:var(--panel); border:1.5px solid var(--line-soft); border-radius:14px; padding:13px 16px; }
  .score-row.top{ border-color:var(--gold); background:linear-gradient(135deg, rgba(201,162,75,0.14), var(--panel)); }
  .score-rank{ font-family:'JetBrains Mono'; font-size:14px; color:var(--cream-dim); width:26px; flex-shrink:0; text-align:center; }
  .score-row.top .score-rank{ font-size:18px; }
  .score-name{ flex:1; font-weight:700; font-size:14.5px; display:flex; align-items:center; gap:8px; min-width:0; }
  .score-count{ font-family:'JetBrains Mono'; font-size:12.5px; color:var(--gold-bright); white-space:nowrap; }

  .danger-zone{ margin-top:34px; padding-top:18px; border-top:1px dashed var(--line); text-align:center; }
  .danger-link{ background:none; border:none; color:var(--cream-dim); font-size:12.5px; cursor:pointer; padding:6px; opacity:0.7; transition:all .15s; }
  .danger-link:hover{ color:var(--hearts); opacity:1; }
  .reset-panel{ background:rgba(226,79,104,0.08); border:1.5px solid rgba(226,79,104,0.35); border-radius:14px; padding:16px; text-align:left; display:flex; flex-direction:column; gap:10px; }
  .reset-panel-label{ font-size:12.5px; color:#ffb3c0; line-height:1.5; }
  .reset-panel input[type=password]{ background:var(--bg-alt); border:1.5px solid var(--line); color:var(--cream); border-radius:12px; padding:12px 14px; font-family:'Work Sans'; font-size:14px; outline:none; }
  .reset-panel input[type=password]:focus{ border-color:var(--hearts); }
  .reset-panel-actions{ display:flex; gap:10px; }
  .reset-panel-actions .btn{ flex:1; padding:12px; font-size:13.5px; }

  .sticky-actions{ position:sticky; bottom:14px; display:flex; flex-direction:column; gap:10px; margin-top:20px; }

  /* ---------- Race step ---------- */
  .horse-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:22px; }
  .horse-card{
    position:relative; border-radius:20px; padding:24px 14px; text-align:center; overflow:hidden;
    background:linear-gradient(160deg, var(--panel), var(--bg-alt));
    border:1.5px solid var(--line-soft); transition:transform .15s, box-shadow .15s;
  }
  .horse-card .glyph{ font-size:52px; line-height:1; margin-bottom:10px; display:block; filter:drop-shadow(0 6px 14px rgba(0,0,0,0.4)); }
  .horse-card .hname{ font-family:'Bebas Neue'; font-size:20px; letter-spacing:0.05em; }
  .horse-card .hcount{ font-family:'JetBrains Mono'; font-size:11px; color:var(--cream-dim); margin-top:4px; }
  .horse-card::before{ content:''; position:absolute; inset:0; opacity:0.08; background:radial-gradient(circle at 30% 20%, currentColor, transparent 60%); }
  .horse-card.c-hearts{ color:var(--hearts); }
  .horse-card.c-spades{ color:var(--spades); }
  .horse-card.c-clubs{ color:var(--clubs); }
  .horse-card.c-diamonds{ color:var(--diamonds); }
  .horse-card.clickable{ cursor:pointer; }
  .horse-card.clickable:hover{ transform:translateY(-4px); box-shadow:0 16px 30px -14px rgba(0,0,0,0.6); border-color:currentColor; }
  .horse-card.winning{ animation:winner-pulse .7s ease; border-color:currentColor; box-shadow:0 0 0 3px currentColor, 0 20px 40px -14px rgba(0,0,0,.7); }
  @keyframes winner-pulse{ 0%{ transform:scale(1);} 40%{ transform:scale(1.06);} 100%{ transform:scale(1);} }

  /* ---------- Result step ---------- */
  .trophy-header{ text-align:center; margin-bottom:26px; }
  .trophy-emoji{ font-size:44px; display:block; margin-bottom:8px; }
  .trophy-title{ font-family:'Bebas Neue'; font-size:32px; letter-spacing:0.03em; }
  .trophy-title .suit{ }
  .ticket{
    position:relative; background:var(--cream); color:var(--ink); border-radius:14px; padding:16px 18px; margin-bottom:14px;
    box-shadow:var(--shadow); animation:pop-in .3s ease;
  }
  .ticket::before, .ticket::after{
    content:''; position:absolute; top:50%; width:20px; height:20px; background:var(--bg); border-radius:50%; transform:translateY(-50%);
  }
  .ticket::before{ left:-10px; }
  .ticket::after{ right:-10px; }
  .ticket-row{ display:flex; align-items:center; justify-content:space-between; }
  .ticket-name{ font-weight:800; font-size:16px; display:flex; align-items:center; gap:8px; }
  .ticket-arrow{ color:#8a8168; font-size:13px; margin:2px 0; }
  .ticket-payout{ font-family:'JetBrains Mono'; font-weight:700; font-size:15px; color:#0F6B4C; }
  .ticket-bet{ font-family:'JetBrains Mono'; font-size:13px; color:#6b6350; }
  .no-winners{ text-align:center; color:var(--cream-dim); padding:26px 10px; font-size:14px; }

  .confetti{ position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:0; }
  .confetti span{ position:absolute; top:-20px; font-size:16px; animation:fall linear forwards; }
  @keyframes fall{ to{ transform:translateY(110vh) rotate(360deg); opacity:0.3; } }

  .result-actions{ display:flex; flex-direction:column; gap:10px; margin-top:26px; position:relative; z-index:1; }

  @media (min-width:640px){
    #app{ padding-top:36px; }
    .start-title{ font-size:72px; }
    .horse-grid{ grid-template-columns:repeat(4,1fr); }
    .suit-grid{ grid-template-columns:1fr 1fr; }
    .sticky-actions{ flex-direction:row-reverse; }
    .sticky-actions .btn{ width:auto; flex:1; }
    .result-actions{ flex-direction:row; }
    .result-actions .btn{ flex:1; }
  }
</style>
</head>
<body>
<div class="bg-decor">
  <span class="bg-icon" style="top:4%; left:6%; font-size:110px; transform:rotate(-18deg);">🥃</span>
  <span class="bg-icon" style="top:2%; left:78%; font-size:130px; transform:rotate(12deg);">🍺</span>
  <span class="bg-icon" style="top:16%; left:42%; font-size:80px; transform:rotate(-8deg);">🎲</span>
  <span class="bg-icon" style="top:26%; left:88%; font-size:95px; transform:rotate(20deg);">🪙</span>
  <span class="bg-icon" style="top:34%; left:12%; font-size:120px; transform:rotate(10deg);">🍾</span>
  <span class="bg-icon" style="top:46%; left:60%; font-size:70px; transform:rotate(-15deg);">♠️</span>
  <span class="bg-icon" style="top:52%; left:4%; font-size:90px; transform:rotate(6deg);">🎰</span>
  <span class="bg-icon" style="top:58%; left:82%; font-size:105px; transform:rotate(-10deg);">🏇</span>
  <span class="bg-icon" style="top:68%; left:34%; font-size:85px; transform:rotate(14deg);">💵</span>
  <span class="bg-icon" style="top:74%; left:70%; font-size:75px; transform:rotate(-6deg);">♥️</span>
  <span class="bg-icon" style="top:82%; left:14%; font-size:115px; transform:rotate(18deg);">🥂</span>
  <span class="bg-icon" style="top:88%; left:56%; font-size:95px; transform:rotate(-12deg);">🪙</span>
  <span class="bg-icon" style="top:10%; left:24%; font-size:60px; transform:rotate(8deg);">🎴</span>
  <span class="bg-icon" style="top:60%; left:48%; font-size:65px; transform:rotate(-20deg);">🍸</span>
  <span class="bg-icon" style="top:94%; left:86%; font-size:80px; transform:rotate(10deg);">🐎</span>
</div>
<div id="app"></div>

<script>
/* ================= STATE ================= */
const SUITS = [
  {key:'hearts',   symbol:'♥', name:'Harten',   cls:'suit-hearts',   card:'c-hearts'},
  {key:'spades',   symbol:'♠', name:'Schoppen', cls:'suit-spades',   card:'c-spades'},
  {key:'clubs',    symbol:'♣', name:'Klaveren', cls:'suit-clubs',    card:'c-clubs'},
  {key:'diamonds', symbol:'♦', name:'Ruiten',   cls:'suit-diamonds', card:'c-diamonds'},
];
const STEP_ORDER = ['players','bets','race','winner','result'];
const STEP_LABELS = {players:'Ruiters', bets:'Inzetten', race:'Race', winner:'Winnaar', result:'Resultaat'};

let state = {
  step: 'start',
  previousStep: 'start',
  players: [],
  knownPlayers: [],
  nextId: 1,
  maxHorses: 2,
  bets: {},
  winner: null,
  showOverview: false,
  overviewMode: 'horse',
  playersWarning: '',
  betsWarning: '',
  pendingDeleteId: null,
  editingPlayerId: null,
  riderStats: [],
  horseStats: {hearts:0, spades:0, clubs:0, diamonds:0},
  scoreboardTab: 'horses',
  scoreboardResetOpen: false,
  scoreboardResetError: '',
  pendingReset: false,
};

function genId(){ return 'kp_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function findKnownByName(name){
  return state.knownPlayers.find(kp => kp.name.toLowerCase() === name.toLowerCase());
}
async function loadKnownPlayers(){
  try{
    if(window.storage){
      const res = await window.storage.get('known-players', false);
      state.knownPlayers = (res && res.value) ? JSON.parse(res.value) : [];
      render();
      return;
    }
  }catch(e){ /* geen opgeslagen data via window.storage, val terug op localStorage */ }
  try{
    const raw = localStorage.getItem('ultimate-paardenrace-ruiters');
    state.knownPlayers = raw ? JSON.parse(raw) : [];
  }catch(e){
    state.knownPlayers = [];
  }
  render();
}
async function saveKnownPlayers(){
  if(window.storage){
    try{
      await window.storage.set('known-players', JSON.stringify(state.knownPlayers), false);
    }catch(e){ /* negeren, we proberen ook localStorage hieronder */ }
  }
  try{
    localStorage.setItem('ultimate-paardenrace-ruiters', JSON.stringify(state.knownPlayers));
  }catch(e){ /* localStorage niet beschikbaar, potje werkt gewoon door in het geheugen */ }
}

async function loadStats(){
  let loaded = false;
  if(window.storage){
    try{
      const rRes = await window.storage.get('rider-stats', false);
      state.riderStats = (rRes && rRes.value) ? JSON.parse(rRes.value) : [];
      const hRes = await window.storage.get('horse-stats', false);
      state.horseStats = (hRes && hRes.value) ? JSON.parse(hRes.value) : {hearts:0,spades:0,clubs:0,diamonds:0};
      loaded = true;
    }catch(e){ /* val terug op localStorage */ }
  }
  if(!loaded){
    try{
      const rRaw = localStorage.getItem('ultimate-paardenrace-rider-stats');
      state.riderStats = rRaw ? JSON.parse(rRaw) : [];
      const hRaw = localStorage.getItem('ultimate-paardenrace-horse-stats');
      state.horseStats = hRaw ? JSON.parse(hRaw) : {hearts:0,spades:0,clubs:0,diamonds:0};
    }catch(e){
      state.riderStats = [];
      state.horseStats = {hearts:0,spades:0,clubs:0,diamonds:0};
    }
  }
  render();
}
async function saveStats(){
  if(window.storage){
    try{
      await window.storage.set('rider-stats', JSON.stringify(state.riderStats), false);
      await window.storage.set('horse-stats', JSON.stringify(state.horseStats), false);
    }catch(e){ /* negeren, we proberen ook localStorage hieronder */ }
  }
  try{
    localStorage.setItem('ultimate-paardenrace-rider-stats', JSON.stringify(state.riderStats));
    localStorage.setItem('ultimate-paardenrace-horse-stats', JSON.stringify(state.horseStats));
  }catch(e){ /* localStorage niet beschikbaar */ }
}
function recordGameResult(){
  state.horseStats[state.winner] = (state.horseStats[state.winner] || 0) + 1;
  state.players.forEach(p=>{
    let rs = state.riderStats.find(r=>r.id===p.id);
    if(!rs){
      rs = {id: p.id, name: p.name, wins: 0};
      state.riderStats.push(rs);
    } else {
      rs.name = p.name;
    }
    const bet = state.bets[p.id] ? state.bets[p.id][state.winner] : '';
    if(bet && bet.trim() !== ''){
      rs.wins += 1;
    }
  });
  saveStats();
}

function ensureBetsInitialized(){
  state.players.forEach(p=>{
    if(!state.bets[p.id]){
      state.bets[p.id] = {hearts:'', spades:'', clubs:'', diamonds:''};
    }
  });
}

function initials(name){
  return name.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
}

/* ================= ACTIONS ================= */
function goStart(){ state = {...state, step:'start'}; render(); }

function startNewGame(){
  state.step = 'players';
  render();
  setTimeout(()=>{ const el = document.getElementById('new-player-name'); if(el) el.focus(); }, 50);
}

function addPlayer(){
  const input = document.getElementById('new-player-name');
  const name = input.value.trim();
  if(!name) return;
  let known = findKnownByName(name);
  if(!known){
    known = {id: genId(), name};
    state.knownPlayers.push(known);
    saveKnownPlayers();
  }
  if(!state.players.some(p=>p.id===known.id)){
    state.players.push({id: known.id, name: known.name});
  }
  input.value = '';
  state.playersWarning = '';
  render();
  setTimeout(()=>{ const el = document.getElementById('new-player-name'); if(el) el.focus(); }, 50);
}
function handlePlayerKey(e){ if(e.key === 'Enter'){ addPlayer(); } }
function removePlayer(id){
  state.players = state.players.filter(p=>p.id!==id);
  delete state.bets[id];
  render();
}
function startEditPlayerName(id){
  state.editingPlayerId = id;
  render();
  setTimeout(()=>{ const el = document.getElementById('edit-player-input'); if(el){ el.focus(); el.select(); } }, 50);
}
function cancelEditPlayerName(){ state.editingPlayerId = null; render(); }
function saveEditPlayerName(id){
  const el = document.getElementById('edit-player-input');
  if(!el) return;
  const trimmed = el.value.trim();
  if(trimmed){
    const player = state.players.find(p=>p.id===id);
    if(player) player.name = trimmed;
    const kp = state.knownPlayers.find(k=>k.id===id);
    if(kp){ kp.name = trimmed; } else { state.knownPlayers.push({id, name: trimmed}); }
    saveKnownPlayers();
  }
  state.editingPlayerId = null;
  render();
}
function handleEditPlayerKey(e, id){
  if(e.key === 'Enter'){ saveEditPlayerName(id); }
  else if(e.key === 'Escape'){ cancelEditPlayerName(); }
}
function toggleKnownPlayer(id){
  const idx = state.players.findIndex(p=>p.id===id);
  if(idx >= 0){
    state.players.splice(idx, 1);
    delete state.bets[id];
  } else {
    const kp = state.knownPlayers.find(k=>k.id===id);
    if(kp) state.players.push({id: kp.id, name: kp.name});
  }
  render();
}
function requestDeleteKnownPlayer(id){
  if(state.pendingDeleteId === id){
    state.knownPlayers = state.knownPlayers.filter(k=>k.id!==id);
    state.pendingDeleteId = null;
    saveKnownPlayers();
    render();
  } else {
    state.pendingDeleteId = id;
    render();
    setTimeout(()=>{ if(state.pendingDeleteId === id){ state.pendingDeleteId = null; render(); } }, 3000);
  }
}
function cancelDeleteKnownPlayer(){ state.pendingDeleteId = null; render(); }
function setMaxHorses(n){ state.maxHorses = n; render(); }

function goToBets(){
  if(state.players.length < 2){
    state.playersWarning = 'Voeg minstens 2 ruiters toe om te beginnen.';
    render();
    return;
  }
  ensureBetsInitialized();
  state.playersWarning = '';
  state.step = 'bets';
  render();
}

function backToPlayers(){ state.step = 'players'; render(); }

function handleBetInput(e){
  const {player, suit} = e.target.dataset;
  state.bets[player][suit] = e.target.value;
  updatePlayerBetUI(player);
}

function betCount(playerId){
  return SUITS.filter(s => state.bets[playerId][s.key].trim() !== '').length;
}

function updatePlayerBetUI(playerId){
  const count = betCount(playerId);
  const badge = document.querySelector(`.bet-count[data-badge="${playerId}"]`);
  if(badge) badge.textContent = `${count}/${state.maxHorses} paarden`;
  const card = document.querySelector(`.player-bet-card[data-card="${playerId}"]`);
  if(card) card.classList.toggle('over-limit', count > state.maxHorses);
  SUITS.forEach(s=>{
    const input = document.querySelector(`.bet-input[data-player="${playerId}"][data-suit="${s.key}"]`);
    if(!input) return;
    const isEmpty = input.value.trim()==='';
    input.disabled = isEmpty && count >= state.maxHorses;
  });
}

function toggleOverview(){ state.showOverview = !state.showOverview; render(); }

function goToRace(){
  const over = state.players.filter(p => betCount(p.id) > state.maxHorses);
  if(over.length){
    state.betsWarning = `${over.map(p=>p.name).join(', ')} heeft/hebben meer paarden gekozen dan toegestaan (max ${state.maxHorses}).`;
    render();
    return;
  }
  state.betsWarning = '';
  state.step = 'race';
  render();
}
function backToBets(){ state.step = 'bets'; render(); }
function goToWinnerStep(){ state.step = 'winner'; render(); }
function backToRace(){ state.step = 'race'; render(); }

function pickWinner(suitKey){
  if(state.winner) return;
  state.winner = suitKey;
  recordGameResult();
  render();
  setTimeout(()=>{ state.step = 'result'; render(); }, 650);
}

function doubleBetText(str){
  const trimmed = str.trim();
  const match = trimmed.match(/^(\d+(?:[.,]\d+)?)\s*(.*)$/);
  if(match){
    const num = parseFloat(match[1].replace(',', '.'));
    const doubled = num * 2;
    const doubledStr = Number.isInteger(doubled) ? doubled.toString() : doubled.toString().replace('.', ',');
    return `${doubledStr} ${match[2]}`.trim();
  }
  return `2x ${trimmed}`;
}

function playAgainSamePlayers(){
  state.bets = {};
  state.winner = null;
  state.showOverview = false;
  state.betsWarning = '';
  state.playersWarning = '';
  state.step = 'players';
  render();
}
function playAgainNewPlayers(){
  state.players = [];
  state.bets = {};
  state.winner = null;
  state.showOverview = false;
  state.playersWarning = '';
  state.betsWarning = '';
  state.step = 'players';
  render();
}
function goToScoreboard(){
  state.previousStep = state.step;
  state.step = 'scoreboard';
  render();
}
function backFromScoreboard(){
  state.step = state.previousStep || 'start';
  state.scoreboardResetOpen = false;
  state.scoreboardResetError = '';
  render();
}
function setScoreboardTab(tab){ state.scoreboardTab = tab; render(); }

function openScoreboardReset(){
  state.scoreboardResetOpen = true;
  state.scoreboardResetError = '';
  render();
  setTimeout(()=>{ const el = document.getElementById('scoreboard-reset-password'); if(el) el.focus(); }, 50);
}
function cancelScoreboardReset(){
  state.scoreboardResetOpen = false;
  state.scoreboardResetError = '';
  render();
}
function handleScoreboardResetKey(e){ if(e.key === 'Enter'){ submitScoreboardReset(); } }
function submitScoreboardReset(){
  const el = document.getElementById('scoreboard-reset-password');
  const value = el ? el.value : '';
  if(value !== 'reset'){
    state.scoreboardResetError = 'Wachtwoord onjuist. Probeer opnieuw.';
    render();
    setTimeout(()=>{ const el2 = document.getElementById('scoreboard-reset-password'); if(el2){ el2.value=''; el2.focus(); } }, 50);
    return;
  }
  state.knownPlayers = [];
  state.riderStats = [];
  state.horseStats = {hearts:0, spades:0, clubs:0, diamonds:0};
  saveKnownPlayers();
  saveStats();
  state.scoreboardResetOpen = false;
  state.scoreboardResetError = '';
  render();
}

let pendingResetTimeout = null;
function fullReset(){
  if(state.step === 'start' || state.step === 'scoreboard') return;
  if(state.pendingReset){
    clearTimeout(pendingResetTimeout);
    state = {step:'start', previousStep:'start', players:[], knownPlayers: state.knownPlayers, nextId:1, maxHorses:2, bets:{}, winner:null, showOverview:false, overviewMode: state.overviewMode, playersWarning:'', betsWarning:'', pendingDeleteId:null, editingPlayerId:null, riderStats: state.riderStats, horseStats: state.horseStats, scoreboardTab: state.scoreboardTab, pendingReset:false};
    render();
  } else {
    state.pendingReset = true;
    render();
    pendingResetTimeout = setTimeout(()=>{ state.pendingReset = false; render(); }, 3000);
  }
}

/* ================= RENDER HELPERS ================= */
function trackHtml(){
  const idx = STEP_ORDER.indexOf(state.step); // 0..4
  const pct = idx <= 0 ? 8 : (idx/(STEP_ORDER.length-1))*100;
  const posts = STEP_ORDER.map((s,i)=>{
    const cls = i < idx ? 'done' : (i === idx ? 'active' : '');
    return `<div class="post ${cls}"><div class="post-dot"></div>${STEP_LABELS[s]}</div>`;
  }).join('');
  return `
  <div class="track-wrap">
    <div class="track">
      <div class="track-fill" style="width:${pct}%"></div>
      <div class="track-horse" style="left:${pct}%">🐎</div>
    </div>
    <div class="track-posts">${posts}</div>
  </div>`;
}

function topbarHtml(){
  return `
  <div class="topbar">
    <div class="brand"><img class="brand-logo" src="${LOGO_DATA_URI}" alt="Ultimate Paardenrace logo"><span>Ultimate Paardenrace</span></div>
    <div class="topbar-actions">
      ${state.step!=='scoreboard' ? `<button class="icon-link" onclick="goToScoreboard()" aria-label="All Time Scorebord">🏆</button>` : ''}
      ${state.step!=='start' && state.step!=='scoreboard' ? `<button class="reset-link ${state.pendingReset?'confirm':''}" onclick="fullReset()">${state.pendingReset ? 'Zeker weten?' : 'Nieuw potje'}</button>` : ''}
    </div>
  </div>`;
}

function overviewListHtml(filterSuit){
  const relevant = state.players
    .map(p => ({p, entries: SUITS.filter(s => state.bets[p.id] && state.bets[p.id][s.key].trim()!=='' && (!filterSuit || s.key===filterSuit))}))
    .filter(x => x.entries.length);
  if(!relevant.length){
    return `<div class="overview-empty">Nog geen inzetten ingevoerd.</div>`;
  }
  return `<div class="overview-list">${relevant.map(({p,entries})=>`
    <div class="overview-player">
      <div class="name">${escapeHtml(p.name)}</div>
      ${entries.map(s=>`
        <div class="overview-bet-line">
          <span class="${s.cls}">${s.symbol}</span> ${s.name}
          <b>${escapeHtml(state.bets[p.id][s.key])}</b>
        </div>`).join('')}
    </div>`).join('')}</div>`;
}

function overviewByHorseHtml(){
  const rows = SUITS.map(s=>{
    const names = state.players
      .filter(p => state.bets[p.id] && state.bets[p.id][s.key].trim() !== '')
      .map(p => escapeHtml(p.name));
    return `
    <div class="overview-horse-row">
      <div class="overview-horse-label"><span class="suit-symbol ${s.cls}">${s.symbol}</span>${s.name}</div>
      <div class="overview-horse-names">${names.length ? names.join(', ') : '<span class="overview-empty-inline">nog geen inzetten</span>'}</div>
    </div>`;
  }).join('');
  return `<div class="overview-horse-list">${rows}</div>`;
}

function setOverviewMode(mode){ state.overviewMode = mode; render(); }

function renderOverviewBlock(){
  return `
  <div class="overview-tabs">
    <button class="overview-tab ${state.overviewMode==='horse' ? 'active' : ''}" onclick="setOverviewMode('horse')">🐎 Per paard</button>
    <button class="overview-tab ${state.overviewMode==='player' ? 'active' : ''}" onclick="setOverviewMode('player')">🙋 Per ruiter</button>
  </div>
  ${state.overviewMode==='horse' ? overviewByHorseHtml() : overviewListHtml()}
  `;
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function renderStart(){
  return `
  <div class="start-wrap">
    <img class="start-logo" src="${LOGO_DATA_URI}" alt="Ultimate Paardenrace logo">
    <div class="start-tagline">
      <div class="tagline-main">Zet in, speel het spel, deel uit of begin te drinken!</div>
      <div class="tagline-sub">Officiële digitale scorebord van <strong>Ultimate Paardenrace</strong>!</div>
    </div>
    <div class="start-cta">
      <button class="btn btn-primary" onclick="startNewGame()">🏁 Nieuw potje starten</button>
      <button class="btn btn-ghost" onclick="goToScoreboard()">🏆 All Time Scorebord</button>
    </div>
    <div class="start-credit">Gemaakt door Tim</div>
  </div>`;
}

function renderKnownPlayers(){
  if(!state.knownPlayers.length) return '';
  const chips = state.knownPlayers.map(kp=>{
    const selected = state.players.some(p=>p.id===kp.id);
    const pendingDelete = state.pendingDeleteId === kp.id;
    return `
    <div class="known-chip ${selected ? 'selected' : ''} ${pendingDelete ? 'pending-delete' : ''}">
      <button class="known-chip-main" onclick="toggleKnownPlayer('${kp.id}')">${selected ? '✓ ' : ''}${escapeHtml(kp.name)}</button>
      ${pendingDelete
        ? `<button class="known-chip-del confirm" onclick="requestDeleteKnownPlayer('${kp.id}')" aria-label="Bevestig verwijderen van ${escapeHtml(kp.name)}">✓ zeker?</button>`
        : `<button class="known-chip-del" onclick="requestDeleteKnownPlayer('${kp.id}')" aria-label="Verwijder ${escapeHtml(kp.name)} uit lijst">✕</button>`
      }
    </div>`;
  }).join('');
  return `
  <div class="section-label">Eerdere ruiters <span class="hint-inline">— tik om te (de)selecteren</span></div>
  <div class="known-chip-wrap">${chips}</div>`;
}

function renderPlayers(){
  const list = state.players.map(p=>{
    if(state.editingPlayerId === p.id){
      return `
      <div class="player-chip editing">
        <input type="text" id="edit-player-input" value="${escapeHtml(p.name)}" onkeydown="handleEditPlayerKey(event,'${p.id}')">
        <div class="player-chip-actions">
          <button class="player-edit" onclick="saveEditPlayerName('${p.id}')" aria-label="Opslaan">✓</button>
          <button class="player-remove" onclick="cancelEditPlayerName()" aria-label="Annuleren">✕</button>
        </div>
      </div>`;
    }
    return `
    <div class="player-chip">
      <div class="player-chip-name"><span class="player-avatar">${initials(p.name)}</span>${escapeHtml(p.name)}</div>
      <div class="player-chip-actions">
        <button class="player-edit" onclick="startEditPlayerName('${p.id}')" aria-label="Naam aanpassen van ${escapeHtml(p.name)}">✎</button>
        <button class="player-remove" onclick="removePlayer('${p.id}')" aria-label="Verwijder ${escapeHtml(p.name)}">✕</button>
      </div>
    </div>`;
  }).join('');

  return `
  <div class="step-title">1. Ruiters</div>
  <div class="step-sub">Voeg iedereen toe die meerijdt.</div>

  ${renderKnownPlayers()}

  <div class="section-label">Nieuwe ruiter</div>
  <div class="add-player-row">
    <input type="text" id="new-player-name" placeholder="Naam van ruiter" onkeydown="handlePlayerKey(event)">
    <button class="icon-btn" onclick="addPlayer()">＋</button>
  </div>

  <div class="section-label">Ruiters in dit potje</div>
  ${state.players.length ? `<div class="player-list">${list}</div>` : `<div class="empty-hint">Nog geen ruiters geselecteerd. Kies er hierboven een paar, of typ een nieuwe naam.</div>`}

  <div class="section-label">Max. aantal paarden per ruiter</div>
  <div class="max-horses-row">
    ${[1,2,3,4].map(n=>`<button class="max-pill ${state.maxHorses===n?'active':''}" onclick="setMaxHorses(${n})">${n}</button>`).join('')}
  </div>

  ${state.playersWarning ? `<div class="warning-banner">⚠️ ${state.playersWarning}</div>` : ''}

  <button class="btn btn-primary" onclick="goToBets()">Verder naar inzetten →</button>
  `;
}

function renderBets(){
  const cards = state.players.map(p=>{
    const count = betCount(p.id);
    return `
    <div class="player-bet-card ${count>state.maxHorses?'over-limit':''}" data-card="${p.id}">
      <div class="player-bet-head">
        <div class="name"><span class="player-avatar">${initials(p.name)}</span>${escapeHtml(p.name)}</div>
        <div class="bet-count" data-badge="${p.id}">${count}/${state.maxHorses} paarden</div>
      </div>
      <div class="suit-grid">
        ${SUITS.map(s=>{
          const val = state.bets[p.id] ? state.bets[p.id][s.key] : '';
          const disabled = (val.trim()==='' && count>=state.maxHorses) ? 'disabled' : '';
          return `
          <div class="suit-row">
            <div class="suit-label"><span class="suit-symbol ${s.cls}">${s.symbol}</span>${s.name}</div>
            <input type="text" class="bet-input" data-player="${p.id}" data-suit="${s.key}" placeholder="bv. 4 slokken" value="${escapeHtml(val)}" oninput="handleBetInput(event)" ${disabled}>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');

  return `
  <div class="step-title">2. Inzetten</div>
  <div class="step-sub">Vul per ruiter in wat ze inzetten. Vrije tekst mag: "4 slokken", "1 adje", "2 shotjes"...</div>

  ${cards}

  ${state.betsWarning ? `<div class="warning-banner">⚠️ ${state.betsWarning}</div>` : ''}

  <button class="overview-toggle" onclick="toggleOverview()">
    <span>📋 ${state.showOverview ? 'Verberg' : 'Bekijk'} overzicht van alle inzetten</span>
    <span>${state.showOverview ? '−' : '+'}</span>
  </button>
  ${state.showOverview ? `<div class="overview-panel card-panel">${renderOverviewBlock()}</div>` : ''}

  <div class="sticky-actions">
    <button class="btn btn-primary" onclick="goToRace()">Naar de race →</button>
    <button class="btn btn-ghost" onclick="backToPlayers()">← Terug naar ruiters</button>
  </div>
  `;
}

function renderRace(){
  const horses = SUITS.map(s=>`
    <div class="horse-card ${s.card}">
      <span class="glyph">${s.symbol}</span>
      <div class="hname display">${s.name}</div>
      <div class="hcount">${state.players.filter(p=>state.bets[p.id] && state.bets[p.id][s.key].trim()!=='').length} inzet(ten)</div>
    </div>`).join('');

  return `
  <div class="step-title">3. De race</div>
  <div class="step-sub">Speel de paardenrace met de echte kaarten. Gebruik het overzicht hieronder om te zien welke ruiters op welk paard hebben ingezet.</div>

  <div class="horse-grid">${horses}</div>

  <div class="section-label">Inzetten overzicht</div>
  <div class="card-panel" style="margin-bottom:22px;">${renderOverviewBlock()}</div>

  <div class="sticky-actions">
    <button class="btn btn-primary" onclick="goToWinnerStep()">🏆 Bepaal de winnaar →</button>
    <button class="btn btn-ghost" onclick="backToBets()">← Terug naar inzetten</button>
  </div>
  `;
}

function renderWinner(){
  const horses = SUITS.map(s=>`
    <div class="horse-card ${s.card} clickable ${state.winner===s.key?'winning':''}" onclick="pickWinner('${s.key}')">
      <span class="glyph">${s.symbol}</span>
      <div class="hname display">${s.name}</div>
      <div class="hcount">${state.winner===s.key ? '🏆 Winnaar!' : 'tik om te kiezen'}</div>
    </div>`).join('');

  return `
  <div class="step-title">4. Winnaar</div>
  <div class="step-sub">Welk paard heeft de race gewonnen?</div>
  <div class="horse-grid">${horses}</div>
  <button class="btn btn-ghost" onclick="backToRace()">← Terug naar de race</button>
  `;
}

function renderResult(){
  const winnerSuit = SUITS.find(s=>s.key===state.winner);
  const winners = state.players
    .map(p => ({p, bet: state.bets[p.id] ? state.bets[p.id][state.winner] : ''}))
    .filter(x => x.bet && x.bet.trim() !== '');

  const confettiColors = ['var(--hearts)','var(--spades)','var(--clubs)','var(--diamonds)','var(--gold)'];
  const confettiSpans = Array.from({length:26}).map((_,i)=>{
    const left = Math.random()*100;
    const delay = Math.random()*0.6;
    const dur = 2.2 + Math.random()*1.8;
    const color = confettiColors[i%confettiColors.length];
    const glyphs = ['♥','♠','♣','♦','●'];
    const g = glyphs[i%glyphs.length];
    return `<span style="left:${left}%; animation-delay:${delay}s; animation-duration:${dur}s; color:${color};">${g}</span>`;
  }).join('');

  const ticketsHtml = winners.length ? winners.map(({p,bet})=>`
    <div class="ticket">
      <div class="ticket-row">
        <div class="ticket-name"><span class="player-avatar" style="background:${'var(--ink)'}; color:var(--gold-bright);">${initials(p.name)}</span>${escapeHtml(p.name)}</div>
      </div>
      <div class="ticket-arrow mono">${escapeHtml(bet)} ingezet →</div>
      <div class="ticket-payout">${escapeHtml(doubleBetText(bet))} uitdelen</div>
    </div>`).join('') : `<div class="no-winners">Niemand had ingezet op ${winnerSuit.name.toLowerCase()}. Niks uit te delen dit potje!</div>`;

  return `
  <div class="confetti">${confettiSpans}</div>
  <div class="trophy-header">
    <span class="trophy-emoji">🏆</span>
    <div class="trophy-title"><span class="${winnerSuit.cls}">${winnerSuit.symbol} ${winnerSuit.name}</span> heeft gewonnen!</div>
  </div>

  <div class="section-label">Uitdelen</div>
  ${ticketsHtml}

  <div class="result-actions">
    <button class="btn btn-primary" onclick="playAgainSamePlayers()">🔁 Opnieuw met dezelfde ruiters</button>
    <button class="btn btn-ghost" onclick="playAgainNewPlayers()">👥 Nieuw potje, andere ruiters</button>
  </div>
  `;
}

/* ================= SCOREBOARD ================= */
function renderScoreboard(){
  const horseRows = SUITS.slice()
    .sort((a,b)=> (state.horseStats[b.key]||0) - (state.horseStats[a.key]||0))
    .map((s,i)=>{
      const wins = state.horseStats[s.key] || 0;
      return `
      <div class="score-row ${i===0 && wins>0 ? 'top' : ''}">
        <div class="score-rank">${i===0 && wins>0 ? '👑' : (i+1)+'.'}</div>
        <div class="score-name"><span class="suit-symbol ${s.cls}">${s.symbol}</span>${s.name}</div>
        <div class="score-count">${wins} ${wins===1 ? 'keer' : 'keer'} gewonnen</div>
      </div>`;
    }).join('');

  const sortedRiders = state.riderStats.slice().sort((a,b)=> b.wins - a.wins);
  const riderRows = sortedRiders.length ? sortedRiders.map((r,i)=>`
    <div class="score-row ${i===0 && r.wins>0 ? 'top' : ''}">
      <div class="score-rank">${i===0 && r.wins>0 ? '👑' : (i+1)+'.'}</div>
      <div class="score-name"><span class="player-avatar">${initials(r.name)}</span>${escapeHtml(r.name)}</div>
      <div class="score-count">${r.wins} ${r.wins===1 ? 'keer' : 'keer'} gewonnen</div>
    </div>`).join('') : `<div class="empty-hint">Nog geen ruiters met resultaten. Speel een potje uit!</div>`;

  return `
  <div class="step-title">🏆 All Time Scorebord</div>
  <div class="step-sub">Alle overwinningen sinds het begin, automatisch bijgehouden.</div>

  <div class="overview-tabs">
    <button class="overview-tab ${state.scoreboardTab==='horses' ? 'active' : ''}" onclick="setScoreboardTab('horses')">🐎 Paarden</button>
    <button class="overview-tab ${state.scoreboardTab==='riders' ? 'active' : ''}" onclick="setScoreboardTab('riders')">👤 Ruiters</button>
  </div>

  <div class="score-list">
    ${state.scoreboardTab==='horses' ? horseRows : riderRows}
  </div>

  <button class="btn btn-ghost" style="margin-top:22px;" onclick="backFromScoreboard()">← Terug</button>

  <div class="danger-zone">
    ${state.scoreboardResetOpen ? `
      <div class="reset-panel">
        <div class="reset-panel-label">⚠️ Dit verwijdert alle opgeslagen ruiters, scores en overwinningen. Dit kan niet ongedaan worden gemaakt.</div>
        <input type="password" id="scoreboard-reset-password" placeholder="Wachtwoord" onkeydown="handleScoreboardResetKey(event)">
        ${state.scoreboardResetError ? `<div class="warning-banner">⚠️ ${state.scoreboardResetError}</div>` : ''}
        <div class="reset-panel-actions">
          <button class="btn btn-primary" style="background:linear-gradient(180deg,#ff7b8f,var(--hearts)); box-shadow:none;" onclick="submitScoreboardReset()">Definitief resetten</button>
          <button class="btn btn-ghost" onclick="cancelScoreboardReset()">Annuleren</button>
        </div>
      </div>
    ` : `<button class="danger-link" onclick="openScoreboardReset()">🗑️ Alles resetten</button>`}
  </div>
  `;
}

/* ================= MAIN RENDER ================= */
function render(){
  const app = document.getElementById('app');
  let body = '';
  if(state.step === 'start'){
    body = renderStart();
  } else if(state.step === 'scoreboard'){
    body = renderScoreboard();
  } else {
    let stepHtml = '';
    if(state.step === 'players') stepHtml = renderPlayers();
    else if(state.step === 'bets') stepHtml = renderBets();
    else if(state.step === 'race') stepHtml = renderRace();
    else if(state.step === 'winner') stepHtml = renderWinner();
    else if(state.step === 'result') stepHtml = renderResult();
    body = trackHtml() + stepHtml;
  }
  app.innerHTML = topbarHtml() + body;
}

render();
loadKnownPlayers();
loadStats();
</script>
</body>
</html>
